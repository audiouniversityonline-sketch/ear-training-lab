<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ear Training Lab - Connection Check</title>
<style>
  /* Deliberately light and dependency-free: if THIS page is black or blank,
     the problem is the browser/network, not the Lab's code. */
  body { margin:0; background:#f6f5f2; color:#1b1a17; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#6b665e; margin:0 0 24px; font-size:14px; }
  .row { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #e3e0d9; }
  .row:last-child { border-bottom:0; }
  .badge { flex:0 0 auto; width:20px; height:20px; border-radius:50%; display:flex; align-items:center;
           justify-content:center; font-size:12px; font-weight:700; color:#fff; margin-top:2px; }
  .ok { background:#2e7d32; } .bad { background:#c62828; } .wait { background:#9e9e9e; }
  .label { font-weight:600; font-size:14px; }
  .val { color:#6b665e; font-size:13px; word-break:break-word; }
  #out { width:100%; box-sizing:border-box; margin-top:20px; padding:12px; font-family:ui-monospace,Menlo,monospace;
         font-size:12px; border:1px solid #cfcbc2; border-radius:8px; background:#fff; height:190px; }
  button { margin-top:10px; padding:11px 18px; font-size:15px; font-weight:600; border:0; border-radius:8px;
           background:#1b1a17; color:#fff; cursor:pointer; }
  .note { margin-top:22px; padding:12px 14px; background:#fff; border:1px solid #e3e0d9; border-radius:8px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ear Training Lab connection check</h1>
  <p class="sub">This page tests whether your browser and network can load everything the Lab needs. It takes a few seconds. Nothing here plays audio.</p>
  <div id="rows"></div>
  <p class="note"><strong>When it finishes:</strong> tap <em>Copy results</em> below and paste them in your reply. That tells us exactly what is being blocked.</p>
  <textarea id="out" readonly></textarea>
  <button id="copy">Copy results</button>
</div>
<script>
(function () {
  var rowsEl = document.getElementById('rows'), results = [], pending = 0, done = false;

  function addRow(key, label) {
    var r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<div class="badge wait" id="b_'+key+'">.</div>' +
                  '<div><div class="label">'+label+'</div><div class="val" id="v_'+key+'">checking...</div></div>';
    rowsEl.appendChild(r);
  }
  function setRow(key, pass, text) {
    var b = document.getElementById('b_'+key), v = document.getElementById('v_'+key);
    if (b) { b.className = 'badge ' + (pass ? 'ok' : 'bad'); b.textContent = pass ? '✓' : '✕'; }
    if (v) v.textContent = text;
    results.push((pass ? 'PASS ' : 'FAIL ') + key + ': ' + text);
    render();
  }
  function render() {
    document.getElementById('out').value =
      'EAR TRAINING LAB CHECK\n' + results.join('\n') + (done ? '\n-- end --' : '');
  }

  var checks = [
    ['browser','Browser'], ['screen','Screen size'], ['frame','Opened inside a frame'],
    ['unpkg','Main script server (unpkg)'], ['jsdelivr','Backup script server (jsdelivr)'],
    ['tailwind','Styling server'], ['audio','Web Audio support'],
    ['storage','Saving progress (localStorage)'], ['files','Lab data files']
  ];
  for (var i=0;i<checks.length;i++) addRow(checks[i][0], checks[i][1]);

  // Environment
  setRow('browser', true, navigator.userAgent);
  setRow('screen', true, window.innerWidth + ' x ' + window.innerHeight +
    ' (device pixel ratio ' + (window.devicePixelRatio||1) + ')');
  var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  setRow('frame', true, framed ? 'yes, running inside an embed' : 'no, opened directly');

  // Web Audio
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) setRow('audio', false, 'this browser has no Web Audio support');
    else { var c = new AC(); setRow('audio', true, 'supported (state: ' + c.state + ')'); try { c.close(); } catch(e){} }
  } catch (e) { setRow('audio', false, 'blocked: ' + e.message); }

  // localStorage (blocked in some private modes / strict settings)
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); setRow('storage', true, 'available'); }
  catch (e) { setRow('storage', false, 'blocked: ' + e.message); }

  // Script servers
  function testScript(key, url) {
    pending++;
    var s = document.createElement('script');
    var t = setTimeout(function () { s.onerror = s.onload = null; setRow(key, false, 'timed out after 8s (blocked or unreachable)'); finish(); }, 8000);
    s.onload = function () { clearTimeout(t); setRow(key, true, 'reachable'); finish(); };
    s.onerror = function () { clearTimeout(t); setRow(key, false, 'BLOCKED or unreachable'); finish(); };
    s.src = url; document.head.appendChild(s);
  }
  function finish() { if (--pending <= 0) { done = true; render(); } }

  testScript('unpkg', 'https://unpkg.com/react@18/umd/react.production.min.js');
  testScript('jsdelivr', 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js');
  testScript('tailwind', 'https://cdn.tailwindcss.com');

  // Lab data file
  pending++;
  try {
    fetch('curriculum.json', { cache: 'no-store' })
      .then(function (r) { setRow('files', r.ok, r.ok ? 'loaded ok' : 'server said ' + r.status); finish(); })
      .catch(function (e) { setRow('files', false, 'could not load: ' + e.message); finish(); });
  } catch (e) { setRow('files', false, 'could not load: ' + e.message); finish(); }

  window.addEventListener('error', function (e) {
    results.push('JS ERROR: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
    render();
  });

  document.getElementById('copy').addEventListener('click', function () {
    var o = document.getElementById('out'); o.select(); o.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); this.textContent = 'Copied. Now paste it in your reply.'; }
    catch (e) { this.textContent = 'Select the text above and copy it.'; }
  });
})();
</script>
</body>
</html>
