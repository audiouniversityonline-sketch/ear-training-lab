<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ear Training Lab · Audio University</title>
<!--
  RETIRED compression.html -> lab.html

  This was the standalone compression trainer. It is superseded by the unified Ear Training
  Lab (lab.html), which is faster, precompiled, and the only copy that receives
  fixes. Saved progress carries over: both use the same localStorage keys
  (earTrainingProgress, au_comp_levels_v1).

  Kept as a redirect rather than deleted so old links, bookmarks and any Circle
  embed still pointing here land on the current app instead of a stale one.
  To restore the original: git revert the commit that added this file.
-->
<meta http-equiv="refresh" content="0; url=lab.html" />
<style>
  body { margin:0; background:#0e0e10; color:#e9e6df; font-family:system-ui,-apple-system,sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:24px }
  a { color:#d4a13a }
</style>
</head>
<body>
  <div>
    <p>Taking you to the Ear Training Lab.</p>
    <p><a href="lab.html">Continue</a></p>
  </div>
  <script>
    // Carry any existing query string across (?week=3, ?preview=1, and so on).
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        
        var q = p.toString();
        location.replace("lab.html" + (q ? "?" + q : ""));
      } catch (e) { location.replace("lab.html"); }
    })();
  </script>
</body>
</html>
